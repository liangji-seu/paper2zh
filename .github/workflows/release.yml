name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Windows installer and Release assets
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Read version and validate tag
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath "VERSION" -Raw -Encoding UTF8).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION 格式无效：$version"
          }
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "标签 $($env:GITHUB_REF_NAME) 与 VERSION $version 不一致，应为 $expectedTag。"
          }
          $notes = ".github/release-notes/v$version.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Release notes 不存在：$notes"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "installer=paper2zh-Setup-$version-win64.exe" >> $env:GITHUB_OUTPUT
          "artifact=paper2zh-v$version-windows" >> $env:GITHUB_OUTPUT
          "notes=$notes" >> $env:GITHUB_OUTPUT

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Compile Python modules
        shell: pwsh
        run: python -m compileall -q app run.py babeldoc_local.py

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check static/workspace.mjs

      - name: Build Windows installer
        shell: pwsh
        run: .\packaging\build.ps1 -BuildPython python

      - name: Check bundled engine independently
        shell: pwsh
        run: |
          $engine = "packaging/stage/paper2zh/_internal/engine/python.exe"
          $entry = "packaging/stage/paper2zh/_internal/babeldoc_local.py"
          if (-not (Test-Path -LiteralPath $engine)) { throw "Bundled engine missing: $engine" }
          if (-not (Test-Path -LiteralPath $entry)) { throw "Bundled engine entrypoint missing: $entry" }
          & $engine $entry --help
          if ($LASTEXITCODE -ne 0) { throw "Bundled engine --help check failed." }

      - name: Verify installer and write SHA256
        shell: pwsh
        run: |
          $installer = "packaging/output/${{ steps.version.outputs.installer }}"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Installer was not produced: $installer"
          }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $name = Split-Path -Leaf $installer
          "$hash  $name" | Set-Content -LiteralPath "packaging/output/SHA256SUMS.txt" -Encoding ascii
          Get-Content -LiteralPath "packaging/output/SHA256SUMS.txt"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: |
            packaging/output/${{ steps.version.outputs.installer }}
            packaging/output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $installer = "packaging/output/${{ steps.version.outputs.installer }}"
          $checksums = "packaging/output/SHA256SUMS.txt"
          $notes = "${{ steps.version.outputs.notes }}"
          gh release create "${env:GITHUB_REF_NAME}" $installer $checksums `
            --repo "${env:GITHUB_REPOSITORY}" `
            --title "paper2zh v$version" `
            --notes-file $notes `
            --verify-tag
