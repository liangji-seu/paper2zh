<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paper2zh · 论文工作区</title>
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="alternate icon" href="/static/icon.ico">
<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#26303d;--line:#e3e7ed;--muted:#778392}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}
.app{height:100dvh;min-height:500px;display:grid;grid-template-columns:var(--sidebar-width,250px) 12px minmax(0,1fr)}
aside{display:flex;flex-direction:column;min-height:0;background:#f7f8fa;border-right:1px solid var(--line)}
.side-head{padding:20px 15px 13px}.brand{font-size:17px;font-weight:700}.brand b{display:inline-grid;place-items:center;background:#273344;color:white;width:27px;height:27px;border-radius:7px;margin-right:8px;font-size:14px}.hint{font-size:11px;color:var(--muted);margin:5px 0 20px 36px}
button{border:1px solid var(--line);border-radius:7px;background:white;color:#465364;padding:6px 10px}.primary{background:#2767d6;border-color:#2767d6;color:white}.import{width:100%;text-align:left;background:#273344;color:white;border-color:#273344;padding:10px}.import:hover{background:#3b4a60}
.side-label{font-size:11px;color:#929aa6;font-weight:700;letter-spacing:.08em;margin:8px 16px}.files{flex:1;min-height:0;overflow:auto;padding:0 7px}.file{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;padding:10px;border-radius:8px}.file:hover{background:#edf0f4}.file.active{background:#e6efff;border-color:#d3e1fa}.file strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.file small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.files-empty{padding:12px;color:var(--muted);font-size:12px}
.side-foot{padding:9px;border-top:1px solid var(--line)}.side-foot button{width:100%;text-align:left;border:0;background:transparent}.side-foot small{display:block;color:var(--muted);margin-left:20px}
.sidebar-resizer{display:flex;align-items:center;justify-content:center;position:relative;background:#f0f3f7;border-right:1px solid var(--line);cursor:col-resize;touch-action:none;user-select:none}.sidebar-resizer:focus-visible{outline:2px solid #2767d6;outline-offset:-2px}.sidebar-resizer button{width:20px;height:34px;padding:0;border:1px solid #d4dce8;border-radius:5px;background:#fff;color:#6b7788;font-size:13px;line-height:1}.sidebar-resizer button:hover{color:#2767d6;background:#f4f7ff}.sidebar-collapsed aside{overflow:hidden;border-right:0}.sidebar-collapsed .sidebar-resizer{cursor:default}.sidebar-collapsed .sidebar-resizer button{cursor:pointer}.sidebar-resizing,.sidebar-resizing *{cursor:col-resize!important;user-select:none!important}
main{min-width:0;display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:7px;height:42px;padding:0 12px;border-bottom:1px solid var(--line)}.title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:600}.menu{display:none}
.tools{display:flex;align-items:center;justify-content:space-between;gap:7px;height:36px;min-height:36px;padding:4px 12px;border-bottom:1px solid var(--line);flex-wrap:nowrap;overflow:hidden}.tabs{display:flex;flex:none;background:#eff1f5;padding:2px;border-radius:7px}.tabs button{border:0;background:transparent;font-size:11px;padding:4px 10px}.tabs button.active{background:#fff;box-shadow:0 1px 4px #d5dbe5}.controls{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:11px;white-space:nowrap}.controls input{width:38px;text-align:center;padding:3px;border:1px solid var(--line);border-radius:5px}.controls button{padding:2px 8px}.zoom{width:38px;text-align:center}
.notice{display:none;padding:4px 12px;background:#f4f7ff;color:#556b91;font-size:11px;line-height:16px}.notice.show{display:block}
.scroll{flex:1;min-height:0;overflow:auto;background:#edf0f3;padding:22px}.pages{display:flex;justify-content:center;align-items:flex-start;gap:20px;min-width:max-content;width:max-content;margin:auto}.panel{flex:none}.caption{color:#707b88;font-size:11px;margin-bottom:6px}.page{display:block;max-width:none;height:auto;background:white;box-shadow:0 2px 12px #17223324}.page-error{display:none;background:#fff;color:#b42318;padding:30px;width:400px}.page-error.show{display:block}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12px}.empty strong{font-size:16px;color:#4d5969}.status{padding:7px 16px;min-height:33px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.status.error,.msg.error{color:#b42318}.msg.ok{color:#15803d}
.backdrop{display:none;position:fixed;inset:0;z-index:10;background:#14203366;align-items:center;justify-content:center;padding:16px}.backdrop.open{display:flex}.modal{background:white;border-radius:12px;width:min(100%,480px);padding:20px;max-height:90dvh;overflow:auto;box-shadow:0 20px 50px #14203330}.modal h2{font-size:17px;margin:0 0 15px}.close{float:right;border:0;font-size:20px;padding:0 4px;color:#8792a0}.field{display:block;font-size:12px;color:#596473;margin:0 0 12px}.field input,.field select{display:block;width:100%;height:36px;margin-top:5px;border:1px solid #d5dce6;border-radius:7px;padding:6px 9px}.field small,.help{font-size:11px;color:#85909e}.pick{width:100%;border:1px dashed #bcc8d8;background:#f8fafc;padding:15px;margin:0 0 14px;text-align:center;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.msg{min-height:17px;font-size:12px;color:var(--muted)}.check{display:flex;align-items:center;gap:6px;font-size:12px;color:#596473}.links{display:flex;gap:12px}.links a{color:#2767d6;font-size:13px}
@media(max-width:720px){.app{display:block}.sidebar-resizer{display:none}.sidebar-collapsed aside{overflow:auto}aside{position:fixed;z-index:5;top:0;bottom:0;width:250px;transform:translateX(-100%);transition:transform .2s}aside.open{transform:none}main{height:100dvh}.menu{display:block;position:relative;z-index:6}.top,.tools{padding-left:9px;padding-right:9px}.tools{height:auto;min-height:36px;flex-wrap:wrap;overflow:visible}.annotate-controls{width:100%;margin:2px 0}.scroll{padding:12px}}
</style>
<link rel="stylesheet" href="/static/workspace.css">
<style>
.library-root-drop{margin:2px 0 5px;padding:6px 9px;border:1px dashed #c5d0de;border-radius:7px;color:#6d7d90;font-size:11px;text-align:center;transition:background .12s,border-color .12s,color .12s}.library-root-drop.drop-target,.folder-row.drop-target{background:#e5effd;border-color:#6b9bd9;color:#2d649d}.file-row.dragging{opacity:.48}.folder-row.drop-target{outline:2px solid #9bbce7;outline-offset:-2px}
</style>
</head>
<body>
<div class="app">
<aside id="sidebar"><div class="side-head"><div class="brand"><img src="/static/icon.svg" alt="" class="brand-icon">paper2zh</div><div class="hint">论文阅读与翻译</div><button class="import" id="open-import">＋　导入论文</button></div><div class="side-label">论文文件 <button id="new-folder" title="新建文件夹">＋ 文件夹</button></div><div class="files" id="files"><div class="files-empty">还没有论文。</div></div><div class="side-foot"><button id="open-settings">⚙　API 设置<small id="provider-summary">读取中…</small></button></div></aside><div class="sidebar-resizer" id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="调整侧栏宽度" tabindex="0"><button id="sidebar-toggle" type="button" aria-label="折叠侧栏" aria-expanded="true">‹</button></div>
<main><div class="top"><button class="menu" id="menu">☰</button><div class="title" id="title">选择一篇论文</div><button id="open-translate" disabled>翻译</button><button id="open-download" disabled>下载</button></div>
<div class="tools"><div class="tabs"><button data-view="source">原文</button><button data-view="translated">译文</button><button data-view="compare" class="active">对照</button></div><div class="controls"><button id="prev">‹</button><input id="page-number" type="number" min="1" value="1"><span>/ <span id="total">—</span></span><button id="next">›</button><span>　</span><button id="zoom-out">−</button><span class="zoom" id="zoom-label">100%</span><button id="zoom-in">＋</button></div><div class="annotate-controls"><span class="annotation-hint">选中文字后批注</span><button class="mini" id="annotation-undo" title="撤销最近一条批注">撤销</button><button class="mini" id="annotation-delete" title="删除所选批注">删除</button></div></div>
<div class="notice" id="notice"></div><div class="progress-wrap" id="progress-wrap" hidden><div class="progress-copy"><span id="progress-stage">正在准备</span><span id="progress-value">处理中</span></div><div class="progress-track"><div id="progress-fill"></div></div></div><div class="scroll" id="scroll"><div class="empty" id="empty"><div><strong>从左侧导入论文</strong><p>原文会显示在这里，翻译后可对照阅读。</p></div></div><div class="pages" id="pages" hidden><div class="panel" id="source-panel"><div class="caption">原文</div><div class="page-frame" id="source-frame"><canvas class="pdf-canvas" id="source-canvas"></canvas><div class="textLayer" id="source-text"></div><div class="annotation-layer" id="source-annotations"></div></div><div class="page-error" id="source-error">原文页面无法显示。</div></div><div class="panel" id="translated-panel"><div class="caption">译文</div><div class="page-frame" id="translated-frame"><canvas class="pdf-canvas" id="translated-canvas"></canvas><div class="textLayer" id="translated-text"></div><div class="annotation-layer" id="translated-annotations"></div></div><div class="page-error" id="translated-error">译文页面无法显示。</div></div></div></div><div class="status" id="status"><span id="status-text">就绪</span><span id="token-usage">Token 未统计</span></div></main></div>
<div class="annotation-menu" id="annotation-menu"><button data-color="#FFE066" class="swatch" style="background:#FFE066" title="黄色高亮"></button><button data-color="#8CE99A" class="swatch" style="background:#8CE99A" title="绿色高亮"></button><button data-color="#74C0FC" class="swatch" style="background:#74C0FC" title="蓝色高亮"></button><button data-color="#FAA2C1" class="swatch" style="background:#FAA2C1" title="粉色高亮"></button><button id="annotation-underline">下划线</button></div>
<div class="file-context-menu" id="file-context-menu" role="menu" aria-label="论文操作" hidden>
<button type="button" role="menuitem" data-file-action="copy-markdown"><span class="menu-item-icon" data-menu-icon="copy" aria-hidden="true"></span>复制 Markdown 目录地址</button>
<button type="button" role="menuitem" data-file-action="move"><span class="menu-item-icon" data-menu-icon="folder" aria-hidden="true"></span>移动到文件夹</button>
<button type="button" role="menuitem" data-file-action="delete"><span class="menu-item-icon" data-menu-icon="trash" aria-hidden="true"></span>从文献库删除</button>
</div>
<div class="file-toast" id="file-toast" role="status" aria-live="polite" hidden></div>
<div class="backdrop" id="import-modal"><div class="modal"><button class="close" data-close="import-modal">×</button><h2>导入论文</h2><input type="file" accept=".pdf,application/pdf" id="file-input" hidden><button class="pick" id="pick-file">点击选择 PDF（最大 100 MB）</button><label class="field">导入后处理<select id="import-action"><option value="import">仅导入，稍后翻译</option><option value="translate">导入并翻译</option><option value="demo">导入并演示流程</option></select></label><div id="import-options" hidden><label class="field">范围<select id="import-mode"><option value="trial">指定页码</option><option value="full">全文</option></select></label><label class="field" id="import-pages-wrap">页码<input id="import-pages" placeholder="例如 1-3 或 1,4-5"></label></div><div class="msg" id="import-msg"></div><div class="actions"><button data-close="import-modal">取消</button><button class="primary" id="submit-import">导入</button></div></div></div>
<div class="backdrop" id="translate-modal"><div class="modal"><button class="close" data-close="translate-modal">×</button><h2>翻译论文</h2><p class="help" id="translate-name"></p><label class="field">范围<select id="translate-mode"><option value="trial">指定页码</option><option value="full">全文</option></select></label><label class="field" id="translate-pages-wrap">页码<input id="translate-pages" placeholder="例如 1-3 或 1,4-5"></label><label class="check"><input type="checkbox" id="translate-demo">演示流程，不调用 API</label><div class="msg" id="translate-msg"></div><div class="actions"><button data-close="translate-modal">取消</button><button class="primary" id="submit-translate">开始翻译</button></div></div></div>
<div class="backdrop" id="settings-modal"><div class="modal"><button class="close" data-close="settings-modal">×</button><h2>API 设置</h2><label class="field">Provider<input id="provider"></label><label class="field">Base URL<input id="base-url"></label><label class="field">模型<input id="model"></label><label class="field">API Key<input id="api-key" type="password" autocomplete="new-password" placeholder="留空保持原值"><small id="key-state"></small></label><label class="check"><input id="reuse-key" type="checkbox">更换服务商或 URL 时复用现有 Key</label><p class="help" id="storage"></p><div class="msg" id="settings-msg"></div><div class="actions"><button id="test-connection">测试连接</button><button class="primary" id="save-settings">保存设置</button></div></div></div>
<div class="backdrop" id="duplicate-modal"><div class="modal"><button class="close" data-close="duplicate-modal">×</button><h2>论文已存在</h2><p class="help" id="duplicate-name">已打开已有论文。</p><div class="actions"><button class="primary" data-close="duplicate-modal">知道了</button></div></div></div>
<div class="backdrop" id="folder-modal"><div class="modal"><button class="close" data-close="folder-modal">×</button><h2 id="folder-title">新建文件夹</h2><label class="field" id="folder-name-wrap">文件夹名称<input id="folder-name" maxlength="80"></label><label class="field">上级文件夹<select id="folder-parent"></select></label><div class="msg" id="folder-msg"></div><div class="actions"><button data-close="folder-modal">取消</button><button class="primary" id="submit-folder">保存</button></div></div></div>
<div class="backdrop" id="folder-delete-modal" role="dialog" aria-modal="true" aria-labelledby="folder-delete-title" aria-describedby="folder-delete-description"><div class="modal"><button class="close" data-close="folder-delete-modal">×</button><h2 id="folder-delete-title">删除文件夹</h2><p class="help" id="folder-delete-description">仅删除“<strong id="folder-delete-name"></strong>”这一分类；本层文献和子文件夹会移到上一级，所有文献内容都会保留。</p><div class="msg" id="folder-delete-msg"></div><div class="actions"><button id="folder-delete-cancel" data-close="folder-delete-modal">取消</button><button class="primary danger" id="submit-folder-delete">删除分类</button></div></div></div>
<div class="backdrop" id="move-modal"><div class="modal"><button class="close" data-close="move-modal">×</button><h2>移动论文</h2><p class="help" id="move-name"></p><label class="field">目标文件夹<select id="move-destination"></select></label><div class="msg" id="move-msg"></div><div class="actions"><button data-close="move-modal">取消</button><button class="primary" id="submit-move">移动</button></div></div></div>
<div class="backdrop" id="delete-modal" role="dialog" aria-modal="true" aria-labelledby="delete-title"><div class="modal"><button class="close" data-close="delete-modal">×</button><h2 id="delete-title">从文献库删除</h2><p class="help">仅删除 <strong id="delete-name"></strong> 在软件文献库中托管的 PDF、译文、Markdown、批注和记录。外部原始 PDF 不会被删除。</p><div class="msg" id="delete-msg"></div><div class="actions"><button id="delete-cancel" data-close="delete-modal">取消</button><button class="primary danger" id="submit-delete">删除文献库副本</button></div></div></div>
<script type="module" src="/static/workspace.mjs"></script>
</body>
</html>
